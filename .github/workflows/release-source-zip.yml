name: Release Source Zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the source zip to
        required: true

permissions:
  contents: write

jobs:
  upload-source-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Create source zip
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          zip_name="${REPO_NAME}-${TAG_NAME}-source.zip"
          git archive \
            --format=zip \
            --prefix "${REPO_NAME}-${TAG_NAME}/" \
            --output "${zip_name}" \
            "refs/tags/${TAG_NAME}" \
            CMakeLists.txt \
            LICENSE \
            README.md \
            README.en.md \
            ek_conf_template.h \
            ek_board_template.h \
            cmake \
            include \
            port \
            scripts \
            src \
            third_party
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"

      - name: Upload source zip to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "${TAG_NAME}" "${ZIP_NAME}" --clobber
